<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>{{DECK_TITLE}}</title>
<!--
  판서보드 엔진 (고정) — 스타일과 스크립트는 고치지 않는다.
  강의마다 바꾸는 곳: <title>, STEPS START ~ STEPS END 사이의 .step 섹션, <body data-bg>(white | chalk).
  요청이 없으면 STEPS에는 빈 섹션 하나만 둔다(흰 빈 페이지).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1d232b; --mute:#636c78; --accent:#1f5fd1; --accent2:#d23b3b;
    --paper:#ffffff; --gridc:rgba(29,35,43,.08); --dfill:#e3edfb;
    --chrome:#ffffff; --chrome-line:#d6dbe1; --hover:#eef2f7; --sel:#1f5fd1; --chip:#22272e;
    --font:"IBM Plex Sans KR",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  }
  body[data-bg="chalk"]{
    --ink:#f3f6f2; --mute:#a9c2b8; --accent:#ffd25c; --accent2:#ff7a85;
    --paper:#1f4d3e; --gridc:rgba(255,255,255,.10); --dfill:rgba(255,255,255,.12); --sel:#5cc8ff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);
    font-family:var(--font);touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none}

  /* ── 종이(배경) ── */
  #paper{position:fixed;inset:0;background:var(--paper)}
  body[data-bg="chalk"] #paper{background:radial-gradient(1400px 850px at 50% 0%,#24584a 0%,#1f4d3e 55%,#173b30 100%)}
  #paper.grid{background-image:linear-gradient(var(--gridc) 1px,transparent 1px),linear-gradient(90deg,var(--gridc) 1px,transparent 1px);background-size:46px 46px}
  body[data-bg="chalk"] #paper.grid{background-image:linear-gradient(var(--gridc) 1px,transparent 1px),linear-gradient(90deg,var(--gridc) 1px,transparent 1px),radial-gradient(1400px 850px at 50% 0%,#24584a 0%,#1f4d3e 55%,#173b30 100%);background-size:46px 46px,46px 46px,auto}

  /* ── 슬라이드(판서 뒤) ── */
  #slides{position:fixed;inset:0;pointer-events:none}
  .step{position:absolute;inset:0;display:none;padding:7vh 7vw 7vh calc(7vw + 76px);
    flex-direction:column;justify-content:center;align-items:flex-start;color:var(--ink)}
  .step.active{display:flex}
  .step .kicker{font-size:clamp(14px,1.7vw,20px);color:var(--accent);font-weight:600;margin-bottom:2vh}
  .step h1{font-size:clamp(30px,5.4vw,72px);line-height:1.2;margin:0;font-weight:700;letter-spacing:-.01em}
  .step h2{font-size:clamp(22px,3.4vw,44px);line-height:1.25;margin:0;font-weight:600}
  .step .sub{margin-top:2.6vh;font-size:clamp(16px,2.2vw,28px);color:var(--mute);font-weight:500}
  .step .hl{color:var(--accent)} .step .hlr{color:var(--accent2)}
  .step .row{display:flex;gap:2.4vw;margin-top:4vh;flex-wrap:wrap;align-items:flex-start}
  .step .card{border:2px solid var(--ink);border-radius:8px;min-width:clamp(140px,16vw,220px);overflow:hidden;background:var(--paper)}
  .step .card b{display:block;background:var(--dfill);padding:10px 14px;font-size:clamp(15px,1.8vw,22px);border-bottom:2px solid var(--ink)}
  .step .card span{display:block;padding:12px 14px;font-size:clamp(14px,1.6vw,20px);color:var(--mute)}
  .step .m{will-change:transform,opacity;opacity:0}

  /* ── 캔버스 ── */
  #pad{position:fixed;inset:0;z-index:2;touch-action:none;cursor:crosshair}
  #ui{position:fixed;inset:0;z-index:4;pointer-events:none}
  #texts{position:fixed;inset:0;z-index:3;pointer-events:none}
  .tx{position:absolute;transform-origin:center center;line-height:1.35;padding:6px 8px;white-space:pre-wrap;word-break:break-word;
    font-family:var(--font);font-weight:500;outline:none;min-height:calc(1.35em + 12px)}
  .tx.editing{pointer-events:auto;outline:2px dashed var(--sel);outline-offset:0;border-radius:6px;user-select:text;-webkit-user-select:text;cursor:text}
  .tx.editing:empty::before{content:"글을 입력하세요";color:var(--mute);opacity:.8}
  #ring{position:fixed;z-index:4;pointer-events:none;display:none;border-radius:50%;transform:translate(-50%,-50%);
    border:2px solid var(--ink);box-shadow:0 0 0 1px var(--paper),inset 0 0 0 1px var(--paper);background:rgba(127,127,127,.08)}
  #hud{position:fixed;z-index:7;pointer-events:none;background:var(--chip);color:#fff;border-radius:8px;padding:4px 10px;
    font:600 13px/1.2 var(--font);font-variant-numeric:tabular-nums;opacity:0;transition:opacity .2s}
  #hud.show{opacity:1}
  #fmt{position:fixed;z-index:7;display:none;align-items:center;gap:2px;padding:5px;border-radius:12px}
  #fmt.open{display:flex}
  .fbtn{height:36px;min-width:36px;border:0;background:transparent;border-radius:9px;cursor:pointer;display:grid;place-items:center;
    color:#1d232b;font:600 16px/1 var(--font);padding:0 6px}
  .fbtn:hover{background:var(--hover)} .fbtn.on{background:#dde8fb;color:#1f5fd1}
  .fbtn:focus-visible{outline:3px solid #1f5fd1;outline-offset:2px}
  #fmt .sw{width:22px;height:22px}
  #fEraser{flex-direction:column;gap:12px;padding:14px;width:250px}
  .preset{width:46px;height:46px;border-radius:10px;border:1px solid var(--chrome-line);background:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
  .preset.on{border-color:#1f5fd1;box-shadow:0 0 0 1px #1f5fd1}
  .preset i{display:block;border:2px solid #1d232b;border-radius:50%}
  #eSize{flex:1;accent-color:#1f5fd1;min-width:0}
  #eVal{font:600 13px/1 var(--font);width:44px;text-align:right;font-variant-numeric:tabular-nums;color:#1d232b}

  /* ── 크롬 공통 ── */
  .bar{background:var(--chrome);border:1px solid var(--chrome-line);box-shadow:0 6px 22px rgba(30,45,70,.12);color:#1d232b}
  .tb{width:44px;height:44px;border-radius:12px;border:0;background:transparent;color:#1d232b;
    display:grid;place-items:center;cursor:pointer;position:relative;flex-shrink:0;padding:0}
  .tb:hover{background:var(--hover)}
  .tb.on{background:#1f5fd1;color:#fff}
  .tb svg{width:24px;height:24px}
  .tb:focus-visible,.sw:focus-visible,.mi:focus-visible{outline:3px solid #1f5fd1;outline-offset:2px}
  .tb .cdot{position:absolute;right:6px;bottom:6px;width:9px;height:9px;border-radius:50%;border:1.5px solid #fff;box-shadow:0 0 0 1px #aab3be}
  .hsep{height:1px;width:28px;background:var(--chrome-line);margin:4px 0;flex-shrink:0}
  .vsep{width:1px;height:28px;background:var(--chrome-line);margin:0 4px;flex-shrink:0}
  .sw{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #b8c0ca;cursor:pointer;flex-shrink:0;padding:0}
  .sw.on{box-shadow:0 0 0 2px #1d232b}
  .lbl{font-size:12px;color:#636c78;white-space:nowrap}

  /* ── 왼쪽 레일 ── */
  #rail{position:fixed;z-index:6;left:14px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;
    align-items:center;gap:2px;padding:6px;border-radius:16px;max-height:calc(100vh - 28px);overflow-y:auto;scrollbar-width:none}
  #rail::-webkit-scrollbar{display:none}
  #rail .sw{margin:4px}
  .fly{position:fixed;z-index:7;display:none;border-radius:14px;padding:8px}
  .fly.open{display:flex}
  #fShapes{flex-direction:column;gap:2px;padding:6px}
  #fPen,#fMore{flex-direction:column;gap:10px;padding:12px 14px;min-width:240px}
  .prow{display:flex;align-items:center;gap:8px}
  .prow .lbl{width:34px}
  .size{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;cursor:pointer;border:0;background:transparent;padding:0}
  .size.on{background:var(--hover)}
  .size i{display:block;border-radius:50%;background:#1d232b}
  .toggle{display:flex;align-items:center;gap:8px;font-size:13px;white-space:nowrap;cursor:pointer;border:0;background:none;padding:0;color:#1d232b;font-family:var(--font)}
  .tg{width:34px;height:20px;border-radius:999px;background:#c5ccd5;position:relative;transition:background .15s}
  .tg::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
  .toggle.on .tg{background:#1f5fd1} .toggle.on .tg::after{left:16px}
  .mi{display:flex;align-items:center;gap:10px;border:0;background:none;padding:8px 6px;border-radius:8px;font:500 14px/1.2 var(--font);color:#1d232b;cursor:pointer;text-align:left}
  .mi:hover{background:var(--hover)}
  .mi svg{width:20px;height:20px}
  .keys{font-size:12px;color:#636c78;line-height:1.6;border-top:1px solid var(--chrome-line);padding-top:8px}

  /* ── 오른쪽 위 캡슐 ── */
  #top{position:fixed;z-index:6;right:14px;top:14px;display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:12px}
  #pager{display:flex;align-items:center;gap:2px}
  #pager .tb{width:34px;height:34px}
  #pageLbl{font:600 13px/1 var(--font);color:#1d232b;border:0;background:none;padding:0 6px;height:34px;border-radius:8px;cursor:pointer;white-space:nowrap}
  #pageLbl:hover{background:var(--hover)}
  .bgpick{display:flex;gap:6px;padding:0 4px}
  .bgpick button{width:24px;height:24px;border-radius:6px;border:1px solid var(--chrome-line);cursor:pointer;padding:0}
  .bgpick button.on{box-shadow:0 0 0 2px #1f5fd1}
  #fPages{flex-direction:column;gap:2px;padding:6px;min-width:200px;max-height:70vh;overflow-y:auto}

  /* ── 선택 미니 바, 자동 맞춤 칩, 텍스트 편집기 ── */
  #selbar{position:fixed;z-index:7;display:none;gap:2px;padding:4px;border-radius:12px}
  #selbar.open{display:flex}
  #selbar .tb{width:38px;height:38px}
  #selbar .az{font:700 13px/1 var(--font);width:auto;padding:0 9px}
  #snapchip{position:fixed;z-index:7;display:none;align-items:center;gap:12px;background:var(--chip);color:#fff;
    border-radius:999px;padding:8px 16px;font:500 14px/1 var(--font);white-space:nowrap}
  #snapchip.open{display:flex}
  #snapchip button{border:0;background:none;color:#9ec0ff;font:600 14px/1 var(--font);cursor:pointer;padding:0}
  #editor{position:fixed;z-index:5;display:none;resize:none;border:2px dashed var(--sel);border-radius:6px;
    background:transparent;outline:none;padding:6px 8px;margin:0;overflow:hidden;transform-origin:center center;
    font-family:var(--font);line-height:1.35;user-select:text;-webkit-user-select:text}
  #editor::placeholder{color:var(--mute);opacity:.8}

  #fsBtn{width:34px;height:34px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body data-bg="white">
<div id="paper"></div>
<div id="slides">

  <!-- ===================== STEPS START ===================== -->
  <!-- 요청이 없으면 빈 섹션 하나만 둔다. 모션 슬라이드 작성법은 reference/motion.md 참고. -->

    <section class="step"></section>

  <!-- ===================== STEPS END ===================== -->

</div>
<canvas id="pad"></canvas>
<div id="texts"></div>
<canvas id="ui"></canvas>
<div id="ring"></div>
<div id="hud"></div>
<textarea id="editor" spellcheck="false"></textarea>

<!-- 왼쪽 레일 -->
<div id="rail" class="bar" role="toolbar" aria-label="판서 도구">
  <button class="tb on" id="tPen" data-i="pen" title="펜 (P) — 한 번 더 누르면 색·굵기"><span class="cdot" id="penDot"></span></button>
  <button class="tb" id="tEraser" data-i="eraser" title="지우개 (E) — 한 번 더 누르면 크기"></button>
  <button class="tb" id="tSelect" data-i="select" title="선택 (V) — 눌러서 잡기, 끌어서 묶기"></button>
  <div class="hsep"></div>
  <button class="tb" id="tShapes" data-i="rect" title="도형 (1~5)"></button>
  <button class="tb" id="tText" data-i="text" title="텍스트 (T)"></button>
  <div class="hsep"></div>
  <button class="sw qs" data-k="0" aria-label="색 1"></button>
  <button class="sw qs" data-k="1" aria-label="색 2"></button>
  <button class="sw qs" data-k="2" aria-label="색 3"></button>
  <div class="hsep"></div>
  <button class="tb" id="bUndo" data-i="undo" title="되돌리기 (Ctrl+Z)"></button>
  <button class="tb" id="bMore" data-i="more" title="더보기"></button>
</div>

<div class="fly bar" id="fShapes" role="menu" aria-label="도형">
  <button class="tb" data-shape="rect" data-i="rect" title="네모 (1)"></button>
  <button class="tb" data-shape="ellipse" data-i="ellipse" title="동그라미 (2)"></button>
  <button class="tb" data-shape="tri" data-i="tri" title="세모 (3)"></button>
  <button class="tb" data-shape="arrow" data-i="arrow" title="화살표 (4)"></button>
  <button class="tb" data-shape="diagram" data-i="diagram" title="다이어그램 박스 (5)"></button>
</div>

<div class="fly bar" id="fPen" role="dialog" aria-label="펜 설정">
  <div class="prow"><span class="lbl">색</span><span id="penColors" class="prow" style="gap:8px"></span></div>
  <div class="prow"><span class="lbl">굵기</span>
    <button class="size" data-s="2" aria-label="가늘게"><i style="width:5px;height:5px"></i></button>
    <button class="size on" data-s="4" aria-label="보통"><i style="width:9px;height:9px"></i></button>
    <button class="size" data-s="8" aria-label="굵게"><i style="width:15px;height:15px"></i></button>
  </div>
  <button class="toggle on" id="autoTg"><span class="tg"></span>도형 자동 맞춤</button>
  <div class="lbl" style="white-space:normal;max-width:230px">세모·네모·동그라미를 그리고 펜을 떼지 않은 채 잠깐 멈추면 반듯하게 맞춥니다.</div>
</div>

<div class="fly bar" id="fEraser" role="dialog" aria-label="지우개 크기">
  <div class="prow"><span class="lbl">크기</span>
    <button class="preset" data-e="16" aria-label="작게"><i style="width:10px;height:10px"></i></button>
    <button class="preset on" data-e="36" aria-label="보통"><i style="width:20px;height:20px"></i></button>
    <button class="preset" data-e="72" aria-label="크게"><i style="width:32px;height:32px"></i></button>
  </div>
  <div class="prow"><span class="lbl"></span><input id="eSize" type="range" min="8" max="120" value="36" aria-label="지우개 지름"><span id="eVal">36px</span></div>
  <div class="lbl" style="white-space:normal;line-height:1.5">[ ] 키로도 줄이고 키웁니다.</div>
</div>

<div class="fly bar" id="fMore" role="menu" aria-label="더보기">
  <button class="mi" id="mGrid" data-i="grid">모눈 켜기</button>
  <button class="mi" id="mAdd" data-i="plus">빈 페이지 추가</button>
  <button class="mi" id="mClear" data-i="clear">이 페이지 판서 모두 지우기</button>
  <div class="keys">P 펜 · E 지우개 · V 선택 · T 텍스트<br>1 네모 · 2 동그라미 · 3 세모 · 4 화살표 · 5 다이어그램<br>[ ] 크기(글자·지우개·펜) · G 모눈 · W 배경 · R 모션 다시 · Del 삭제<br>← → 페이지 · Ctrl+Z 되돌리기</div>
</div>

<!-- 오른쪽 위 -->
<div id="top" class="bar">
  <div id="pager">
    <button class="tb" id="pPrev" data-i="left" title="이전 페이지"></button>
    <button id="pageLbl">1 / 1</button>
    <button class="tb" id="pNext" data-i="right" title="다음 페이지"></button>
    <div class="vsep"></div>
  </div>
  <div class="bgpick">
    <button id="bgWhite" class="on" style="background:#fff" title="화이트보드" aria-label="화이트보드"></button>
    <button id="bgChalk" style="background:#1f4d3e" title="칠판" aria-label="칠판"></button>
  </div>
  <div class="vsep"></div>
  <button class="tb" id="fsBtn" data-i="full" title="전체화면"></button>
</div>
<div class="fly bar" id="fPages" role="menu" aria-label="페이지 목록"></div>

<div id="selbar" class="bar">
  <button class="tb az" id="sDown" title="글자 작게 ([)">A−</button>
  <button class="tb az" id="sUp" title="글자 크게 (])">A+</button>
  <button class="tb" id="sEdit" data-i="text" title="글 고치기"></button>
  <button class="tb" id="sDup" data-i="dup" title="복제"></button>
  <button class="tb" id="sDel" data-i="clear" title="삭제 (Del)"></button>
</div>
<div id="fmt" class="bar" role="toolbar" aria-label="글자 서식">
  <button class="fbtn" data-cmd="bold" title="굵게 (Ctrl+B)"><b>B</b></button>
  <button class="fbtn" data-cmd="italic" title="기울임 (Ctrl+I)"><i style="font-family:Georgia,serif">I</i></button>
  <button class="fbtn" data-cmd="underline" title="밑줄 (Ctrl+U)"><u>U</u></button>
  <button class="fbtn" data-cmd="strikeThrough" title="취소선"><s>S</s></button>
  <div class="vsep"></div>
  <button class="fbtn" data-rs="-1" title="작게 ([)">A−</button>
  <button class="fbtn" data-rs="1" title="크게 (])">A+</button>
  <div class="vsep"></div>
  <span id="fmtColors" style="display:flex;gap:6px;padding:0 2px"></span>
  <div class="vsep"></div>
  <button class="fbtn" id="fmtHl" title="형광펜"><span id="fmtHlSw" style="padding:2px 5px;border-radius:3px">가</span></button>
  <button class="fbtn" data-cmd="removeFormat" title="서식 지우기">⌫</button>
</div>
<div id="snapchip"><span id="snapTxt">동그라미로 맞춤</span><button id="snapUndo">원래대로</button></div>

<script id="engine">
/* ── 판서보드 엔진 (고정) — 수정 금지 ── */
(function(){
"use strict";
const $=id=>document.getElementById(id);

/* ───────── 아이콘 ───────── */
const IC={
  pen:'<path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 6l3 3"/>',
  eraser:'<path d="M8 20h12"/><path d="M5 15l9-9 5 5-8 8H8z"/><path d="M10 10l5 5"/>',
  select:'<path d="M5 4l12 6-5 2-2 5z"/><rect x="3" y="3" width="18" height="18" rx="1" stroke-dasharray="3 3" opacity=".5"/>',
  text:'<path d="M5 6V4h14v2"/><path d="M12 4v16"/><path d="M9 20h6"/>',
  undo:'<path d="M9 7L4 12l5 5"/><path d="M4 12h10a6 6 0 0 1 0 12"/>',
  more:'<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>',
  full:'<path d="M4 9V4h5"/><path d="M20 9V4h-5"/><path d="M4 15v5h5"/><path d="M20 15v5h-5"/>',
  grid:'<path d="M3 9h18M3 15h18M9 3v18M15 3v18"/>',
  clear:'<path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  dup:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>',
  left:'<path d="M15 5l-7 7 7 7"/>', right:'<path d="M9 5l7 7-7 7"/>',
  rect:'<rect x="4" y="6" width="16" height="12" rx="1"/>',
  ellipse:'<circle cx="12" cy="12" r="8"/>',

/* ───────── 캔버스 ───────── */
const pad=$('pad'), ctx=pad.getContext('2d'), ui=$('ui'), uctx=ui.getContext('2d');
let W=innerWidth, H=innerHeight, dpr=1;

/* ───────── 기하 ───────── */
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function distSeg(p,a,b){ const dx=b.x-a.x, dy=b.y-a.y, L=dx*dx+dy*dy; let t=L?((p.x-a.x)*dx+(p.y-a.y)*dy)/L:0; t=Math.max(0,Math.min(1,t)); return Math.hypot(p.x-(a.x+t*dx),p.y-(a.y+t*dy)); }
function distStroke(p,s){ const q=s.pts; if(q.length===1) return dist(p,q[0]); let m=1e9; for(let i=1;i<q.length;i++) m=Math.min(m,distSeg(p,q[i-1],q[i])); return m; }
function strokeBox(s){ let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; for(const q of s.pts){ if(q.x<x0)x0=q.x; if(q.y<y0)y0=q.y; if(q.x>x1)x1=q.x; if(q.y>y1)y1=q.y; } const m=s.size+2; return {x0:x0-m,y0:y0-m,x1:x1+m,y1:y1+m}; }
const center=it=>({x:it.x+it.w/2, y:it.y+it.h/2});
function toLocal(it,p){ const c=center(it), r=-(it.rot||0), dx=p.x-c.x, dy=p.y-c.y; return {x:dx*Math.cos(r)-dy*Math.sin(r)+it.w/2, y:dx*Math.sin(r)+dy*Math.cos(r)+it.h/2}; }
function toWorld(it,l){ const c=center(it), r=it.rot||0, dx=l.x-it.w/2, dy=l.y-it.h/2; return {x:c.x+dx*Math.cos(r)-dy*Math.sin(r), y:c.y+dx*Math.sin(r)+dy*Math.cos(r)}; }
function localBox(it){ return {x0:Math.min(0,it.w), y0:Math.min(0,it.h), x1:Math.max(0,it.w), y1:Math.max(0,it.h)}; }
function itemAABB(it){
  if(it.t==='stroke') return strokeBox(it);
  const b=localBox(it), pad2=(it.size||2)+2;
  const cs=[{x:b.x0,y:b.y0},{x:b.x1,y:b.y0},{x:b.x1,y:b.y1},{x:b.x0,y:b.y1}].map(l=>toWorld(it,l));
  return {x0:Math.min(...cs.map(c=>c.x))-pad2, y0:Math.min(...cs.map(c=>c.y))-pad2, x1:Math.max(...cs.map(c=>c.x))+pad2, y1:Math.max(...cs.map(c=>c.y))+pad2};
}
const headH=it=>Math.min(58,Math.max(34,Math.abs(it.h)*0.26));
function outline(it){
  const w=it.w,h=it.h;
  switch(it.t){
    case 'rect': case 'text': return [[[0,0],[w,0],[w,h],[0,h],[0,0]]];
    case 'diagram': return [[[0,0],[w,0],[w,h],[0,h],[0,0]],[[0,headH(it)],[w,headH(it)]]];
    case 'ellipse': { const a=[]; for(let i=0;i<=40;i++){ const t=i/40*Math.PI*2; a.push([w/2+w/2*Math.cos(t), h/2+h/2*Math.sin(t)]); } return [a]; }
    case 'tri': { const p=it.p.map(q=>[q[0]*w,q[1]*h]); return [[...p,p[0]]]; }
    case 'arrow': return [[[0,0],[w,h]]];
  } return [];
}
function distOutline(it,p){ const l=toLocal(it,p); let m=1e9; for(const pl of outline(it)) for(let i=1;i<pl.length;i++) m=Math.min(m,distSeg(l,{x:pl[i-1][0],y:pl[i-1][1]},{x:pl[i][0],y:pl[i][1]})); return m; }
function insideItem(it,p){ const l=toLocal(it,p), b=localBox(it); return l.x>=b.x0&&l.x<=b.x1&&l.y>=b.y0&&l.y<=b.y1; }
function hitItem(it,p){
  if(it.t==='stroke') return distStroke(p,it)<=10+it.size;
  if(it.t==='text'||it.t==='diagram') return insideItem(it,p);
  return distOutline(it,p)<=12+it.size;
}
function pickItem(p){ for(let i=items.length-1;i>=0;i--) if(hitItem(items[i],p)) return items[i]; return null; }

/* ───────── 그리기 ───────── */
const lw=(s,pr)=>Math.max(1,s*(0.45+pr*1.1));
function drawSeg(c,col,sz,a,b,erase){
  c.globalCompositeOperation=erase?'destination-out':'source-over';

  const w=erase?lw(sz,b.p)*2.8:lw(sz,b.p);

  else { c.lineWidth=w; c.beginPath(); c.moveTo(a.x,a.y); c.lineTo(b.x,b.y); c.stroke(); }
  c.globalCompositeOperation='source-over';
}
function wrap(c,text,maxW){
  const out=[]; for(const para of String(text||'').split('\n')){
    if(!para){ out.push(''); continue; }
    let line=''; for(const ch of para){ const t=line+ch; if(c.measureText(t).width>maxW&&line){ out.push(line); line=ch.trimStart(); } else line=t; }
    out.push(line);

}
function cssVar(n){ return getComputedStyle(document.body).getPropertyValue(n).trim(); }
function drawItem(c,it){

  const sw=it.size*0.9+1.2;
  c.save();
  const cc=center(it); c.translate(cc.x,cc.y); c.rotate(it.rot||0); c.translate(-it.w/2,-it.h/2);
  c.strokeStyle=it.color; c.fillStyle=it.color; c.lineWidth=sw;
  const w=it.w,h=it.h;

  else if(it.t==='ellipse'){ c.beginPath(); c.ellipse(w/2,h/2,Math.abs(w)/2,Math.abs(h)/2,0,0,Math.PI*2); c.stroke(); }
  else if(it.t==='tri'){ const p=it.p; c.beginPath(); c.moveTo(p[0][0]*w,p[0][1]*h); c.lineTo(p[1][0]*w,p[1][1]*h); c.lineTo(p[2][0]*w,p[2][1]*h); c.closePath(); c.stroke(); }
  else if(it.t==='arrow'){
    const L=Math.hypot(w,h)||1, ux=w/L, uy=h/L, hs=Math.max(14,sw*4.2);
    c.beginPath(); c.moveTo(0,0); c.lineTo(w-ux*hs*0.6,h-uy*hs*0.6); c.stroke();
    c.beginPath(); c.moveTo(w,h); c.lineTo(w-ux*hs-uy*hs*0.55,h-uy*hs+ux*hs*0.55); c.lineTo(w-ux*hs+uy*hs*0.55,h-uy*hs-ux*hs*0.55); c.closePath(); c.fill();
  }
  else if(it.t==='diagram'){
    const hh=headH(it);
    c.fillStyle=cssVar('--paper')||'#fff'; c.fillRect(0,0,w,h);
    c.fillStyle=cssVar('--dfill'); c.fillRect(0,0,w,hh);
    c.strokeRect(0,0,w,h); c.beginPath(); c.moveTo(0,hh); c.lineTo(w,hh); c.stroke();
    if(!it._editing){
      c.fillStyle=it.color; c.textBaseline='middle'; c.textAlign='center';
      const tf=Math.round(hh*0.46); c.font=`600 ${tf}px ${FONT}`;
      c.fillText(wrap(c,it.title,w-16)[0]||'',w/2,hh/2+1);
      c.textAlign='left'; c.textBaseline='top'; const bf=it.fs||22; c.font=`400 ${bf}px ${FONT}`;
      const lines=wrap(c,it.body,w-24); let y=hh+12;
      for(const ln of lines){ if(y+bf>h-6) break; c.fillText(ln,12,y); y+=bf*1.35; }
    }
  }
  c.restore();
}
function render(){ ctx.clearRect(0,0,W,H); for(const it of items) drawItem(ctx,it); renderTexts(); }

/* ───────── 선택 표시(UI 캔버스) ───────── */
let sel=[], drag=null, marquee=null;
function selAABB(){ let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; for(const it of sel){ const b=itemAABB(it); x0=Math.min(x0,b.x0); y0=Math.min(y0,b.y0); x1=Math.max(x1,b.x1); y1=Math.max(y1,b.y1); } return {x0,y0,x1,y1}; }
const single=()=>sel.length===1&&sel[0].t!=='stroke'?sel[0]:null;
function handles(it){
  const b=localBox(it), m=10;
  const tr=toWorld(it,{x:b.x1+m,y:b.y0-m});
  const rotP=toWorld(it,{x:b.x1+m+24,y:b.y0-m-24});
  const br=toWorld(it,{x:b.x1+m,y:b.y1+m});
  return {tr,rotP,br,canResize:it.t!=='arrow'};
}
function drawUI(){
  uctx.clearRect(0,0,W,H);
  const S=cssVar('--sel')||'#1f5fd1';
  uctx.save(); uctx.strokeStyle=S; uctx.lineWidth=2; uctx.setLineDash([8,6]);
  if(marquee){ const x=Math.min(marquee.s.x,marquee.e.x), y=Math.min(marquee.s.y,marquee.e.y); uctx.strokeRect(x,y,Math.abs(marquee.e.x-marquee.s.x),Math.abs(marquee.e.y-marquee.s.y)); }
  const one=single();
  if(one){
    const b=localBox(one), m=10, cs=[{x:b.x0-m,y:b.y0-m},{x:b.x1+m,y:b.y0-m},{x:b.x1+m,y:b.y1+m},{x:b.x0-m,y:b.y1+m}].map(l=>toWorld(one,l));
    uctx.beginPath(); cs.forEach((p,i)=>i?uctx.lineTo(p.x,p.y):uctx.moveTo(p.x,p.y)); uctx.closePath(); uctx.stroke();
    uctx.setLineDash([]);
    const h=handles(one);
    uctx.beginPath(); uctx.moveTo(h.tr.x,h.tr.y); uctx.lineTo(h.rotP.x,h.rotP.y); uctx.stroke();
    uctx.fillStyle=S; uctx.beginPath(); uctx.arc(h.rotP.x,h.rotP.y,15,0,Math.PI*2); uctx.fill();
    uctx.strokeStyle='#fff'; uctx.lineWidth=2.6; uctx.lineCap='round';
    uctx.beginPath(); uctx.arc(h.rotP.x,h.rotP.y,7,-Math.PI*0.9,Math.PI*0.55); uctx.stroke();
    const ax=h.rotP.x+7*Math.cos(Math.PI*0.55), ay=h.rotP.y+7*Math.sin(Math.PI*0.55);
    uctx.beginPath(); uctx.moveTo(ax-5,ay-1); uctx.lineTo(ax,ay); uctx.lineTo(ax+1,ay-6); uctx.stroke();
    if(h.canResize){ uctx.fillStyle='#fff'; uctx.strokeStyle=S; uctx.lineWidth=2.5; uctx.fillRect(h.br.x-8,h.br.y-8,16,16); uctx.strokeRect(h.br.x-8,h.br.y-8,16,16); }
  } else if(sel.length){
    const b=selAABB(); uctx.strokeRect(b.x0-6,b.y0-6,b.x1-b.x0+12,b.y1-b.y0+12);
  }
  uctx.restore();
  placeSelbar();
}
const selbar=$('selbar');
function placeSelbar(){
  if(!sel.length||drag||marquee){ selbar.classList.remove('open'); return; }
  const b=selAABB(); const one=single();
  $('sEdit').style.display=(one&&(one.t==='text'||one.t==='diagram'))?'':'none';
  const hasTx=sel.some(it=>it.t==='text'||it.t==='diagram');
  $('sUp').style.display=$('sDown').style.display=hasTx?'':'none';
  selbar.classList.add('open');
  const bw=selbar.offsetWidth, bh=selbar.offsetHeight;
  let x=(b.x0+b.x1)/2-bw/2, y=b.y0-bh-44; if(y<8) y=b.y1+44;
  x=Math.max(8,Math.min(W-bw-8,x)); y=Math.max(8,Math.min(H-bh-8,y));
  selbar.style.left=x+'px'; selbar.style.top=y+'px';
}
function clearSel(){ sel=[]; drag=null; marquee=null; drawUI(); }

/* ───────── 자동 도형 맞춤 ───────── */
function dp(pts,eps){
  if(pts.length<3) return pts.slice();
  let idx=0,md=0; const a=pts[0], b=pts[pts.length-1];
  for(let i=1;i<pts.length-1;i++){ const d=distSeg(pts[i],a,b); if(d>md){ md=d; idx=i; } }
  if(md>eps){ const l=dp(pts.slice(0,idx+1),eps), r=dp(pts.slice(idx),eps); return l.slice(0,-1).concat(r); }
  return [a,b];
}
function cleanPoly(v,minD){
  let out=v.slice(), changed=true;
  while(changed&&out.length>3){ changed=false;
    for(let i=0;i<out.length;i++){ const a=out[(i-1+out.length)%out.length], b=out[i], c=out[(i+1)%out.length];
      const a1=Math.atan2(b.y-a.y,b.x-a.x), a2=Math.atan2(c.y-b.y,c.x-b.x); let turn=Math.abs(a2-a1); if(turn>Math.PI) turn=2*Math.PI-turn;
      if(dist(a,b)<minD||turn<0.42){ out.splice(i,1); changed=true; break; } } }
  return out;
}
function recognize(pts){
  if(pts.length<10) return null;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; for(const q of pts){ x0=Math.min(x0,q.x); y0=Math.min(y0,q.y); x1=Math.max(x1,q.x); y1=Math.max(y1,q.y); }
  const w=x1-x0, h=y1-y0, diag=Math.hypot(w,h);
  if(diag<40||w<15||h<15) return null;
  if(dist(pts[0],pts[pts.length-1])>Math.max(28,0.25*Math.max(w,h))) return null;
  let area=0; for(let i=0;i<pts.length;i++){ const a=pts[i], b=pts[(i+1)%pts.length]; area+=a.x*b.y-b.x*a.y; }
  const ratio=Math.abs(area)/2/(w*h);
  let fi=0,fd=0; pts.forEach((q,i)=>{ const d=dist(q,pts[0]); if(d>fd){ fd=d; fi=i; } });
  const eps=0.075*diag;
  const A=dp(pts.slice(0,fi+1),eps), B=dp(pts.slice(fi).concat([pts[0]]),eps);
  const v=cleanPoly(A.concat(B.slice(1,-1)),0.1*diag);
  const n=v.length;
  if(n===3&&ratio>0.28&&ratio<0.72){
    let a0=1e9,b0=1e9,a1=-1e9,b1=-1e9; for(const q of v){ a0=Math.min(a0,q.x); b0=Math.min(b0,q.y); a1=Math.max(a1,q.x); b1=Math.max(b1,q.y); }
    const ww=Math.max(1,a1-a0), hh=Math.max(1,b1-b0);
    return {t:'tri',x:a0,y:b0,w:ww,h:hh,p:v.map(q=>[(q.x-a0)/ww,(q.y-b0)/hh])};
  }
  if(n===4&&ratio>0.74) return {t:'rect',x:x0,y:y0,w,h};
  if(n>=4&&ratio>0.64&&ratio<0.9) return {t:'ellipse',x:x0,y:y0,w,h};
  return null;
}
const chip=$('snapchip'); let chipTimer=null, lastSnap=null;
function showChip(shape){
  $('snapTxt').textContent=SHAPE_NAME[shape.t]+'로 맞춤';
  chip.classList.add('open');
  const b=itemAABB(shape), cw=chip.offsetWidth;
  chip.style.left=Math.max(8,Math.min(W-cw-8,(b.x0+b.x1)/2-cw/2))+'px';
  chip.style.top=Math.min(H-50,b.y1+14)+'px';
  clearTimeout(chipTimer); chipTimer=setTimeout(hideChip,3500);
}
function hideChip(){ chip.classList.remove('open'); lastSnap=null; }
$('snapUndo').addEventListener('click',()=>{ if(!lastSnap) return; const i=items.indexOf(lastSnap.shape); if(i>=0) items[i]=lastSnap.stroke; hideChip(); render(); });

/* ───────── 글 상자(DOM으로 그려 서식을 지원) ───────── */
const textsEl=$('texts'), tnodes=new Map(); let tid=1;
const esc=t=>String(t||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])).replace(/\n/g,'<br>');
let edNode=null, edItem=null, edTBefore=null;
function renderTexts(){
  const live=new Set();
  for(const it of items){
    if(it.t!=='text') continue;
    if(it.html==null) it.html=esc(it.text);
    if(!it._id) it._id=tid++; else tid=Math.max(tid,it._id+1);
    let n=tnodes.get(it._id);
    if(!n){ n=document.createElement('div'); n.className='tx'; n.spellcheck=false; textsEl.appendChild(n); tnodes.set(it._id,n); bindText(n); }
    n._it=it; live.add(it._id);
    n.style.left=it.x+'px'; n.style.top=it.y+'px'; n.style.width=it.w+'px';
    n.style.fontSize=it.fs+'px'; n.style.color=it.color; n.style.transform=`rotate(${it.rot||0}rad)`;
    if(n!==edNode&&n._html!==it.html){ n.innerHTML=it.html; n._html=it.html; }
    const h=n.offsetHeight; if(h) it.h=h;
  }
  for(const [id,n] of tnodes) if(!live.has(id)&&n!==edNode){ n.remove(); tnodes.delete(id); }
}
function bindText(n){
  n.addEventListener('pointerdown',e=>e.stopPropagation());
  n.addEventListener('keydown',e=>{
    e.stopPropagation();
    if(e.key==='Escape'){ e.preventDefault(); closeEditor(true); return; }
    if((e.key==='['||e.key===']')&&!getSelection().isCollapsed){ e.preventDefault(); scaleRange(e.key===']'?1:-1); }
  });
  n.addEventListener('paste',e=>{ e.preventDefault(); const t=(e.clipboardData||window.clipboardData).getData('text/plain'); document.execCommand('insertText',false,t); });
  n.addEventListener('input',()=>{ if(n._it) n._it.h=n.offsetHeight; });
}
function openTextEdit(it,before){
  closeEditor(false); clearSel();
  edItem=it; it._editing=true; render();
  const n=tnodes.get(it._id); edNode=n;
  edTBefore=before===undefined?JSON.stringify(items.map(stripEdit)):before;
  n.contentEditable='true'; n.classList.add('editing');
  const caretEnd=()=>{ n.focus({preventScroll:true}); const r=document.createRange(); r.selectNodeContents(n); r.collapse(false); const s=getSelection(); s.removeAllRanges(); s.addRange(r); };
  caretEnd(); setTimeout(()=>{ if(edNode===n&&document.activeElement!==n) caretEnd(); },0);
}
function closeTextEdit(autoSel){
  const it=edItem, n=edNode; edItem=null; edNode=null; it._editing=false;
  n.contentEditable='false'; n.classList.remove('editing'); hideFmt();
  const s=getSelection(); if(s.rangeCount&&n.contains(s.anchorNode)) s.removeAllRanges(); n.blur();
  it.html=n.innerHTML.replace(/(<br\s*\/?>\s*)+$/,''); n._html=null;
  const empty=!n.textContent.trim();
  if(empty){ const i=items.indexOf(it); if(i>=0) items.splice(i,1); }
  const after=JSON.stringify(items.map(stripEdit));
  if(edTBefore!==null&&after!==edTBefore) pushUndo(edTBefore);
  edTBefore=null; render();
  if(!empty&&autoSel){ setTool('select'); sel=[it]; }
  drawUI();
}

/* 서식 바: 편집 중 글자를 드래그하면 뜬다 */
const fmt=$('fmt'), HL={white:'#fff1a8',chalk:'#5b6a22'};
function hideFmt(){ fmt.classList.remove('open'); }
function placeFmt(){
  const s=getSelection();
  if(!edNode||!s.rangeCount||s.isCollapsed||!edNode.contains(s.anchorNode)){ hideFmt(); return; }
  const r=s.getRangeAt(0).getBoundingClientRect();

/* 배경 */
function remap(c,from,to){ const i=from.indexOf(c); return i<0?c:to[i]; }
const hexRgb=h=>{ const n=parseInt(h.slice(1),16); return `rgb(${n>>16&255}, ${n>>8&255}, ${n&255})`; };
function remapStr(str,from,to){
  let out=String(str);
  from.forEach((c,i)=>{ const tag='\u0001'+i+'\u0001'; [c,c.toUpperCase(),hexRgb(c)].forEach(v=>{ out=out.split(v).join(tag); }); });
  return out.replace(/\u0001(\d+)\u0001/g,(_,i)=>to[+i]);
}
function remapItems(arr,from,to,fromAll,toAll){ for(const it of arr){ it.color=remap(it.color,from,to); if(it.html&&fromAll) it.html=remapStr(it.html,fromAll,toAll); } }

/* ───────── 포인터 ───────── */
const pos=e=>({x:e.clientX,y:e.clientY,p:(e.pressure&&e.pressure>0)?e.pressure:0.5});
let drawing=false, curStroke=null, last=null, holdTimer=null, holdAnchor=null;
let erasing=false, erasePath=null, creating=null, lastTap={it:null,t:0};

function armHold(p){ clearTimeout(holdTimer); holdAnchor=p; if(autoShape) holdTimer=setTimeout(tryAutoShape,550); }
function tryAutoShape(){
  if(!drawing||!curStroke) return;
  const r=recognize(curStroke.pts); if(!r) return;
  const shape=Object.assign({rot:0,color:curStroke.color,size:curStroke.size},r);
  const i=items.indexOf(curStroke); if(i<0) return;
  items[i]=shape; lastSnap={shape,stroke:curStroke};
  drawing=false; curStroke=null; render(); showChip(shape);
}
function beginChange(){ if(drag&&!drag.pushed){ pushUndo(drag.pre); drag.pushed=true; } }
function moveItem(it,dx,dy){ if(it.t==='stroke') it.pts.forEach(q=>{ q.x+=dx; q.y+=dy; }); else { it.x+=dx; it.y+=dy; } }

pad.addEventListener('contextmenu',e=>e.preventDefault());
pad.addEventListener('pointerdown',e=>{
  if(e.button>0) return;
  e.preventDefault();
  const p=pos(e);
  if(flys.some(id=>$(id).classList.contains('open'))){ closeFlys(); }
  if(editing||edItem){ closeEditor(true); return; }
  if(chip.classList.contains('open')) hideChip();
  try{ pad.setPointerCapture(e.pointerId); }catch(_){}

  if(tool==='pen'){
    snap(); drawing=true; curStroke={t:'stroke',color,size,pts:[p]}; items.push(curStroke);
    drawSeg(ctx,color,size,p,p); last=p; armHold(p); return;
  }
  if(tool==='eraser'){ erasing=true; erasePath=[p]; showRing(p); eraseSeg(p,p); return; }
  if(tool==='shape'){
    snap();
    const it={t:shapeKind,x:p.x,y:p.y,w:0,h:0,rot:0,color,size};
    if(shapeKind==='tri') it.p=[[.5,0],[1,1],[0,1]];
    if(shapeKind==='diagram'){ it.title=''; it.body=''; it.fs=22; }
    items.push(it); creating={it,s:p}; return;
  }
  if(tool==='text'){
    const before=JSON.stringify(items);
    const fs=Math.max(18,Math.round(size*2+20));
    const it={t:'text',x:p.x-8,y:p.y-fs*0.75-6,w:Math.min(520,Math.max(180,W-p.x-24)),h:fs*1.35+12,rot:0,color,fs,html:''};
    items.push(it); openTextEdit(it,before); return;
  }
  if(tool==='select'){
    const pre=JSON.stringify(items);
    const one=single();
    if(one){
      const h=handles(one);
      if(dist(p,h.rotP)<=24){ const c=center(one); drag={k:'rot',it:one,c,a0:Math.atan2(p.y-c.y,p.x-c.x),r0:one.rot||0,pre}; drawUI(); return; }
      if(h.canResize&&dist(p,h.br)<=20){ const b=localBox(one); drag={k:'res',it:one,anchor:toWorld(one,{x:b.x0,y:b.y0}),pre}; drawUI(); return; }
    }
    const hit=pickItem(p);
    if(hit&&sel.includes(hit)||(!hit&&sel.length>1&&(()=>{const b=selAABB();return p.x>=b.x0&&p.x<=b.x1&&p.y>=b.y0&&p.y<=b.y1;})())){
      drag={k:'move',last:p,pre}; checkDbl(hit); drawUI(); return;
    }
    if(hit){ sel=[hit]; drag={k:'move',last:p,pre}; checkDbl(hit); drawUI(); return; }

  }
});
function checkDbl(hit){
  const now=performance.now();
  if(hit&&lastTap.it===hit&&now-lastTap.t<380&&(hit.t==='text'||hit.t==='diagram')){ lastTap={it:null,t:0}; drag=null; openEditor(hit); return; }
  lastTap={it:hit,t:now};
}
pad.addEventListener('pointermove',e=>{
  const evs=(e.getCoalescedEvents&&e.getCoalescedEvents().length)?e.getCoalescedEvents():[e];
  const p=pos(e);
  if(tool==='eraser') showRing(p);
  if(drawing&&curStroke){
    for(const ev of evs){ const q=pos(ev); curStroke.pts.push(q); drawSeg(ctx,curStroke.color,curStroke.size,last,q); last=q; }
    if(dist(p,holdAnchor)>5) armHold(p);
    return;
  }
  if(erasing){ for(const ev of evs){ const q=pos(ev), l=erasePath[erasePath.length-1]; erasePath.push(q); eraseSeg(l,q); } return; }
  if(creating){
    const it=creating.it, s=creating.s;
    if(it.t==='arrow'){ it.x=s.x; it.y=s.y; it.w=p.x-s.x; it.h=p.y-s.y; }
    else { it.x=Math.min(s.x,p.x); it.y=Math.min(s.y,p.y); it.w=Math.abs(p.x-s.x); it.h=Math.abs(p.y-s.y); }
    render(); return;
  }
  if(marquee){ marquee.e=p; drawUI(); return; }
  if(!drag) return;
  if(drag.k==='move'){ const dx=p.x-drag.last.x, dy=p.y-drag.last.y; if(!dx&&!dy) return; beginChange(); for(const it of sel) moveItem(it,dx,dy); drag.last=p; render(); drawUI(); }
  else if(drag.k==='rot'){
    beginChange(); let r=drag.r0+Math.atan2(p.y-drag.c.y,p.x-drag.c.x)-drag.a0;
    const q=Math.PI/2, near=Math.round(r/q)*q; if(Math.abs(r-near)<0.07) r=near;
    drag.it.rot=r; render(); drawUI();
  }
  else if(drag.k==='res'){
    beginChange(); const it=drag.it, rot=it.rot||0, a=drag.anchor, dx=p.x-a.x, dy=p.y-a.y;
    const lx=dx*Math.cos(-rot)-dy*Math.sin(-rot), ly=dx*Math.sin(-rot)+dy*Math.cos(-rot);
    const w=Math.max(30,lx-10), h=it.t==='text'?null:Math.max(24,ly-10);
    it.w=w; if(h==null) renderTexts(); else it.h=h;
    const c={x:a.x+(it.w/2)*Math.cos(rot)-(it.h/2)*Math.sin(rot), y:a.y+(it.w/2)*Math.sin(rot)+(it.h/2)*Math.cos(rot)};
    it.x=c.x-it.w/2; it.y=c.y-it.h/2; render(); drawUI();
  }
});
function endPointer(e){
  clearTimeout(holdTimer);
  if(e&&e.pointerType==='touch'&&tool==='eraser') hideRing();
  if(drawing){ drawing=false; curStroke=null; last=null; return; }
  if(erasing){ erasing=false; applyErase(erasePath); erasePath=null; return; }
  if(creating){
    const it=creating.it, s=creating.s; creating=null;
    if(Math.abs(it.w)<8&&Math.abs(it.h)<8){
      const D={rect:[220,140],ellipse:[160,160],tri:[180,150],diagram:[280,190],arrow:[180,0]}[it.t];
      if(it.t==='arrow'){ it.x=s.x; it.y=s.y; it.w=D[0]; it.h=0; } else { it.w=D[0]; it.h=D[1]; it.x=s.x-D[0]/2; it.y=s.y-D[1]/2; }
    } else if(it.t==='diagram'){ it.w=Math.max(it.w,120); it.h=Math.max(it.h,90); }
    render();
    if(it.t==='diagram') openEditor(it,null);
    return;
  }
  if(marquee){
    const x0=Math.min(marquee.s.x,marquee.e.x), x1=Math.max(marquee.s.x,marquee.e.x), y0=Math.min(marquee.s.y,marquee.e.y), y1=Math.max(marquee.s.y,marquee.e.y);
    marquee=null;
    if(x1-x0>4&&y1-y0>4) sel=items.filter(it=>{
      if(it.t==='stroke') return it.pts.some(q=>q.x>=x0&&q.x<=x1&&q.y>=y0&&q.y<=y1);
      const c=center(it); return c.x>=x0&&c.x<=x1&&c.y>=y0&&c.y<=y1;
    });

  }

}
pad.addEventListener('pointerup',endPointer);
pad.addEventListener('pointercancel',endPointer);
pad.addEventListener('pointerleave',()=>{ if(!erasing) hideRing(); });

/* 지우개: 획은 지나간 점을 잘라내고, 도형·글은 테두리에 닿으면 지운다 */
function nearPath(q,path,r){ if(path.length===1) return dist(q,path[0])<=r; for(let i=1;i<path.length;i++) if(distSeg(q,path[i-1],path[i])<=r) return true; return false; }
function eraseSeg(a,b){ ctx.save(); ctx.globalCompositeOperation='destination-out'; ctx.strokeStyle=ctx.fillStyle='#000'; ctx.lineWidth=eraserSize; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); ctx.beginPath(); ctx.arc(b.x,b.y,eraserSize/2,0,Math.PI*2); ctx.fill(); ctx.restore(); }
function applyErase(path){
  const r=eraserSize/2, before=JSON.stringify(items), out=[]; let changed=false;
  for(const it of items){
    if(it.t==='stroke'){
      const rr=r+it.size*0.5; let piece=[], removed=false;
      for(const q of it.pts){ if(nearPath(q,path,rr)){ removed=true; if(piece.length){ out.push({t:'stroke',color:it.color,size:it.size,pts:piece}); piece=[]; } } else piece.push(q); }
      if(!removed){ out.push(it); continue; }
      changed=true; if(piece.length) out.push({t:'stroke',color:it.color,size:it.size,pts:piece});
    } else {
      const hit=path.some(q=>it.t==='text'?insideItem(it,q):distOutline(it,q)<=r+it.size);
      if(hit) changed=true; else out.push(it);
    }
  }
  if(changed){ pushUndo(before); setItems(out); }
  render();
}

/* ───────── 모션 (Remotion 방식의 프레임 API, 영상 렌더링 없음) ───────── */
const FPS=30;
const Easing={ linear:t=>t, in:t=>t*t*t, out:t=>1-Math.pow(1-t,3), inOut:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2 };
function interpolate(f,inR,outR,o){
  o=o||{}; const el=o.extrapolateLeft||'extend', er=o.extrapolateRight||'extend', ease=o.easing||Easing.linear;
  let i=1; while(i<inR.length-1&&f>inR[i]) i++;
  const a=inR[i-1], b=inR[i], oa=outR[i-1], ob=outR[i];
  let t=(f-a)/((b-a)||1);
  if(t<0&&el==='clamp') t=0; if(t>1&&er==='clamp') t=1;
  if(t<0&&el==='identity') return f; if(t>1&&er==='identity') return f;
  return oa+(ob-oa)*(t>=0&&t<=1?ease(t):t);
}
const springCache={};
function spring(o){
  const fps=o.fps||FPS, cfg=Object.assign({damping:10,mass:1,stiffness:100,overshootClamping:false},o.config||{});
  const from=o.from==null?0:o.from, to=o.to==null?1:o.to, f=Math.max(0,o.frame);
  const key=JSON.stringify([fps,cfg]); let arr=springCache[key];
  if(!arr){ arr=[0]; let x=0,v=0; const dt=1/fps/8;
    for(let n=1;n<=fps*10;n++){ for(let k=0;k<8;k++){ const a=(-cfg.stiffness*(x-1)-cfg.damping*v)/cfg.mass; v+=a*dt; x+=v*dt; } arr.push(cfg.overshootClamping?Math.min(x,1):x); }
    springCache[key]=arr; }
  const fi=Math.min(arr.length-1,Math.floor(f)), fr=f-Math.floor(f), val=fi+1<arr.length?arr[fi]+(arr[fi+1]-arr[fi])*fr:arr[fi];
  return from+(to-from)*val;
}
const customs={};
window.MOTION={ FPS, Easing, interpolate, spring, on(id,fn){ customs[id]=fn; if(steps[cur]&&steps[cur].id===id) startMotion(steps[cur]); }, replay(){ startMotion(steps[cur]); } };

let motionRAF=null;
const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function prepEl(el){
  if(el._prep) return; el._prep=true;
  const a=el.dataset.anim||'fade-up';
  if(a==='type') el._full=el.textContent;
  if(a==='draw') el._paths=[...el.querySelectorAll('path,line,polyline,polygon,circle,rect,ellipse')].concat(el.matches('path,line,polyline,polygon,circle,rect,ellipse')?[el]:[]).map(p=>{ let L=0; try{ L=p.getTotalLength(); }catch(_){ L=1000; } p.style.strokeDasharray=L; return {p,L}; });
}
function applyAnim(el,f){
  const a=el.dataset.anim||'fade-up', from=+(el.dataset.from||0), dur=Math.max(1,+(el.dataset.dur||18));
  const t=interpolate(f,[from,from+dur],[0,1],{extrapolateLeft:'clamp',extrapolateRight:'clamp',easing:Easing.out});
  const s=el.style;
  switch(a){
    case 'fade': s.opacity=t; break;
    case 'fade-up': s.opacity=t; s.transform=`translateY(${(1-t)*28}px)`; break;
    case 'fade-down': s.opacity=t; s.transform=`translateY(${(t-1)*28}px)`; break;
    case 'slide-left': s.opacity=t; s.transform=`translateX(${(1-t)*70}px)`; break;
    case 'slide-right': s.opacity=t; s.transform=`translateX(${(t-1)*70}px)`; break;
    case 'scale': s.opacity=t; s.transform=`scale(${0.86+0.14*t})`; break;
    case 'pop': { const v=spring({frame:f-from,fps:FPS,config:{damping:11,stiffness:140}}); s.opacity=Math.min(1,Math.max(0,f-from)/4); s.transform=`scale(${f<from?0:v})`; break; }
    case 'grow-x': s.opacity=1; s.transformOrigin='left center'; s.transform=`scaleX(${t})`; break;
    case 'grow-y': s.opacity=1; s.transformOrigin='center bottom'; s.transform=`scaleY(${t})`; break;
    case 'draw': s.opacity=1; (el._paths||[]).forEach(({p,L})=>p.style.strokeDashoffset=L*(1-t)); break;
    case 'type': s.opacity=f>=from?1:0; el.textContent=el._full.slice(0,Math.round(el._full.length*t)); break;
    case 'count': { s.opacity=f>=from?1:0; const to=+(el.dataset.to||0), st=+(el.dataset.start||0), d=+(el.dataset.dec||0); el.textContent=(st+(to-st)*t).toLocaleString('ko-KR',{minimumFractionDigits:d,maximumFractionDigits:d}); break; }
  }
}
function startMotion(sec){
  cancelAnimationFrame(motionRAF);
  if(!sec) return;
  const els=[...sec.querySelectorAll('.m')], fn=customs[sec.id];
  if(!els.length&&!fn) return;
  els.forEach(prepEl);
  let end=+(sec.dataset.frames||0);
  els.forEach(el=>{ end=Math.max(end,+(el.dataset.from||0)+Math.max(1,+(el.dataset.dur||18))+(el.dataset.anim==='pop'?30:0)); });
  const api={interpolate,spring,Easing,FPS,el:s=>sec.querySelector(s),all:s=>[...sec.querySelectorAll(s)]};
  const paint=f=>{ els.forEach(el=>applyAnim(el,f)); if(fn) fn(f,api); };
  if(reduce){ paint(end); return; }
  paint(0);
  const t0=performance.now();
  const tick=now=>{ const f=(now-t0)/1000*FPS; paint(Math.min(f,end)); if(f<end) motionRAF=requestAnimationFrame(tick); };
  motionRAF=requestAnimationFrame(tick);
}

/* ───────── 전체화면 ───────── */
const fsBtn=$('fsBtn');
const isFs=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
fsBtn.addEventListener('click',()=>{ const el=document.documentElement;
  if(isFs()) (document.exitFullscreen||document.webkitExitFullscreen).call(document);
  else { const rq=el.requestFullscreen||el.webkitRequestFullscreen; if(rq) rq.call(el); } });
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{ fsBtn.classList.toggle('on',isFs()); setTimeout(fit,60); }));

/* ───────── 단축키 ───────── */
addEventListener('keydown',e=>{
  if(editing||edItem) return;
  if((e.ctrlKey||e.metaKey)&&(e.key==='z'||e.key==='Z')){ e.preventDefault(); doUndo(); return; }
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  const k=e.key;
  if(k==='ArrowRight'||k==='PageDown') go(cur+1);
  else if(k==='ArrowLeft'||k==='PageUp') go(cur-1);
  else if(k==='p') setTool('pen');
  else if(k==='e') setTool('eraser');
  else if(k==='v') setTool('select');
  else if(k==='t') setTool('text');
  else if('12345'.includes(k)&&k.length===1) setShape(['rect','ellipse','tri','arrow','diagram'][+k-1]);
  else if(k==='g') setGrid(!gridOn);
  else if(k==='w') setBg(bg==='white'?'chalk':'white');
  else if(k==='r') startMotion(steps[cur]);
  else if(k===']'){ e.preventDefault(); sizeStep(1); }
  else if(k==='['){ e.preventDefault(); sizeStep(-1); }
  else if(k==='Delete'||k==='Backspace'){ e.preventDefault(); doDelete(); }
  else if(k==='Escape'){ closeFlys(); clearSel(); }
});

/* ───────── 시작 ───────── */
addEventListener('resize',fit);
steps.forEach((s,i)=>s.classList.toggle('active',i===0));
bg=document.body.dataset.bg==='chalk'?'chalk':'white';
color=PAL[bg][0];
$('bgWhite').classList.toggle('on',bg==='white'); $('bgChalk').classList.toggle('on',bg==='chalk');
try{ document.execCommand('styleWithCSS',false,false); }catch(_){}
setEraser(36); syncColors(); syncPager(); fit();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(render);
startMotion(steps[0]);
})();
</script>
