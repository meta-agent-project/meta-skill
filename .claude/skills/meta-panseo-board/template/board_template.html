<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>{{DECK_TITLE}}</title>
<!--
  판서슬라이드 엔진 (고정) — 위쪽 스타일과 아래쪽 스크립트는 건드리지 말 것.
  강의별로 바꾸는 곳은 STEPS START ~ STEPS END 사이의 .step 섹션과 :root 강조색뿐.
  기본 배경은 <body data-bg="navy">. chalk, white, black 중 하나로 바꿔 시작 배경을 정할 수 있다.
-->
<style>
  :root{
    --bg:#0e131c; --board:#101722; --ink:#e8eef7; --dim:#7c8aa0;
    --line:#1c2636; --accent:#5cc8ff; --warn:#ff5c6e; --gold:#ffd25c; --green:#54e3a0;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    color:var(--ink); touch-action:none; overscroll-behavior:none;}
  #stage{position:fixed; inset:0;}

  /* ── 콘텐츠 레이어 (판서 뒤) ── */
  #content{position:absolute; inset:0; z-index:0; pointer-events:none;
    background:radial-gradient(1200px 700px at 50% -10%, #16202e 0%, var(--board) 55%, var(--bg) 100%);}
  #content::before{content:""; position:absolute; inset:0; opacity:.5;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),
                     linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:46px 46px; -webkit-mask:radial-gradient(circle at 50% 40%,#000,transparent 85%);
            mask:radial-gradient(circle at 50% 40%,#000,transparent 85%);}
  .step{position:absolute; inset:0; display:none; padding:6vh 7vw;
    flex-direction:column; align-items:flex-start; justify-content:center;}
  .step.active{display:flex; animation:fade .5s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .kicker{font-size:clamp(13px,1.8vw,20px); letter-spacing:.35em; color:var(--accent);
    text-transform:uppercase; margin-bottom:2.2vh; font-weight:700;}
  h1{font-size:clamp(30px,6vw,76px); line-height:1.18; margin:0; font-weight:800; letter-spacing:-.01em;}
  .sub{margin-top:3vh; font-size:clamp(16px,2.4vw,30px); color:var(--dim); font-weight:500;}
  .hl{color:var(--gold);} .hlb{color:var(--accent);} .hlr{color:var(--warn);} .hlg{color:var(--green);}

  /* ── 재사용 컴포넌트 (reference/components.md 참고) ── */
  /* 썸네일 피드 */
  .feed{display:flex; gap:1.4vw; margin-top:4vh; flex-wrap:wrap;}
  .thumb{width:clamp(150px,17vw,230px); height:clamp(86px,10vw,130px); border-radius:12px;
    background:linear-gradient(135deg,#1d2a3d,#121a26); border:1px solid #283950;
    position:relative; overflow:hidden; display:flex; align-items:flex-end; padding:10px;
    font-size:clamp(11px,1.2vw,15px); font-weight:700; color:#dce6f2;}
  .thumb b{color:var(--warn);}
  .thumb::after{content:"▶"; position:absolute; top:8px; right:10px; color:#ff5c6e; font-size:14px;}
  /* 가로 게이지 */
  .gauges{margin-top:5vh; width:min(560px,80vw);}
  .grow{display:flex; align-items:center; gap:14px; margin:14px 0;}
  .glabel{width:120px; font-size:clamp(14px,1.7vw,20px); color:var(--dim);}
  .gbar{flex:1; height:18px; border-radius:10px; background:#1a2433; overflow:hidden; border:1px solid #28394f;}
  .gfill{height:100%;}
  /* 번호 리스트(약속) */
  .promise{margin-top:4vh; display:flex; flex-direction:column; gap:1.8vh;}
  .promise .p{display:flex; align-items:baseline; gap:16px; font-size:clamp(17px,2.4vw,30px); font-weight:700;}
  .promise .n{color:var(--accent); font-variant-numeric:tabular-nums;}
  .promise .x{color:var(--dim); font-weight:500; font-size:.7em;}

  /* ── 칠판 (판서모드) ── */
  #board{position:absolute; inset:0; z-index:1; display:none;
    background:radial-gradient(1400px 850px at 50% 0%, #1a4a40 0%, #103029 58%, #0b241f 100%);
    box-shadow:inset 0 0 0 14px #5a3d24, inset 0 0 0 16px #3a2614, inset 0 0 120px rgba(0,0,0,.5);}
  #board.show{display:block;}
  #board::after{content:"판서모드"; position:absolute; top:24px; left:50%; transform:translateX(-50%);
    font-size:13px; letter-spacing:.4em; color:rgba(255,255,255,.18); font-weight:700;}
  /* ── 모눈종이 격자(판서모드용) ── */
  #board.grid{
    background:
      linear-gradient(rgba(255,255,255,.10) 1px, transparent 1px) 0 0/46px 46px,
      linear-gradient(90deg, rgba(255,255,255,.10) 1px, transparent 1px) 0 0/46px 46px,
      radial-gradient(1400px 850px at 50% 0%, #1a4a40 0%, #103029 58%, #0b241f 100%);}

  /* ── 판서 캔버스 ── */
  #pad{position:absolute; inset:0; z-index:2; touch-action:none; cursor:crosshair;}

  /* ── 툴바 ── */
  #tools{position:absolute; z-index:3; left:50%; bottom:18px; transform:translateX(-50%);
    display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:16px;
    flex-wrap:nowrap; max-width:96vw; overflow-x:auto;
    background:rgba(12,18,28,.82); border:1px solid #243349; backdrop-filter:blur(8px);
    box-shadow:0 8px 30px rgba(0,0,0,.45);}
  .swatch{width:30px;height:30px;border-radius:50%;border:2px solid #2c3c54;cursor:pointer;}
  .swatch.sel{border-color:#fff; transform:scale(1.12);}
  .btn{height:34px;min-width:40px;padding:0 12px;border-radius:10px;border:1px solid #2c3c54;
    background:#16202e;color:var(--ink);font-size:14px;font-weight:700;cursor:pointer;display:flex;
    align-items:center;justify-content:center;gap:6px;white-space:nowrap;flex-shrink:0;}
  .btn:active{background:#1f2c3e;}
  .btn.on{background:var(--accent);color:#06121d;border-color:var(--accent);}
  .sep{width:1px;height:28px;background:#2c3c54;margin:0 2px;}
  .sizes{display:flex;gap:6px;align-items:center;}
  .sz{width:26px;height:26px;border-radius:50%;border:1px solid #2c3c54;background:#16202e;cursor:pointer;
    display:flex;align-items:center;justify-content:center;}
  .sz i{display:block;border-radius:50%;background:var(--ink);}
  .sz.sel{border-color:var(--accent);}

  /* ── 네비게이션 ── */
  .nav{position:absolute;z-index:3;top:50%;transform:translateY(-50%);width:54px;height:54px;
    border-radius:50%;border:1px solid #243349;background:rgba(12,18,28,.7);color:var(--ink);
    font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  #prev{left:14px;} #next{right:14px;}
  #dots{position:absolute;z-index:3;top:16px;left:50%;transform:translateX(-50%);display:flex;gap:9px;}
  .dot{width:9px;height:9px;border-radius:50%;background:#2c3c54;}
  .dot.on{background:var(--accent);width:24px;border-radius:5px;}
  #idx{position:absolute;z-index:3;top:14px;right:18px;font-size:13px;color:var(--dim);font-weight:700;}
  .hint{position:absolute;z-index:3;bottom:64px;left:50%;transform:translateX(-50%);
    font-size:12px;color:#46566e;letter-spacing:.05em;}
  #fsBtn{position:absolute;z-index:4;top:12px;left:12px;width:38px;height:38px;border-radius:10px;
    border:1px solid #243349;background:rgba(12,18,28,.7);color:var(--ink);font-size:20px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;}
  #fsBtn.on{background:var(--accent);color:#06121d;}
  /* ── 배경 테마 (navy 기본 · chalk 칠판 · white 화이트보드 · black) ── */
  .bgc{width:24px;height:24px;border-radius:6px;border:2px solid #2c3c54;cursor:pointer;flex-shrink:0;}
  .bgc.sel{border-color:#fff;transform:scale(1.12);}
  body[data-bg="chalk"] #content{background:radial-gradient(1400px 850px at 50% 0%, #1a4a40 0%, #103029 58%, #0b241f 100%);}
  body[data-bg="chalk"]{--line:#1f4a40;}
  body[data-bg="white"]{--line:#e3e7ec;}
  body[data-bg="white"] #content{background:#fbfbf8;}
  body[data-bg="white"] #board{background:#fbfbf8;
    box-shadow:inset 0 0 0 14px #c9ced6, inset 0 0 0 16px #a9b0ba, inset 0 0 80px rgba(0,0,0,.05);}
  body[data-bg="white"] #board.grid{background:
      linear-gradient(rgba(0,0,0,.09) 1px, transparent 1px) 0 0/46px 46px,
      linear-gradient(90deg, rgba(0,0,0,.09) 1px, transparent 1px) 0 0/46px 46px, #fbfbf8;}
  body[data-bg="white"] #board::after{color:rgba(0,0,0,.16);}
  body[data-bg="white"] .hint{color:#9aa4b2;}
  body[data-bg="white"] #fsBtn{background:rgba(255,255,255,.85);border-color:#cfd5dd;color:#1b1f24;}
  body[data-bg="black"]{--line:#1a1a1a;}
  body[data-bg="black"] #content{background:#0a0a0a;}
  body[data-bg="black"] #board{background:#0d0d0d;
    box-shadow:inset 0 0 0 14px #2a2a2a, inset 0 0 0 16px #1a1a1a;}
  body[data-bg="black"] #board.grid{background:
      linear-gradient(rgba(255,255,255,.08) 1px, transparent 1px) 0 0/46px 46px,
      linear-gradient(90deg, rgba(255,255,255,.08) 1px, transparent 1px) 0 0/46px 46px, #0d0d0d;}
</style>
</head>
<body data-bg="navy">
<div id="stage">
  <div id="content">

  <!-- ===================== STEPS START ===================== -->
  <!-- 강의별로 이 영역만 교체. 첫 섹션에 class="step active", 나머지는 class="step".
       글자는 최소로 — 빈 공간은 판서로 채운다. 컴포넌트는 reference/components.md 참고. -->

    <section class="step active">
      <div class="kicker">{{KICKER}}</div>
      <h1>여기에 <span class="hlb">한 줄짜리</span> 큰 메시지</h1>
      <div class="sub">보조 한 줄 — <span class="hl">핵심 단어만 강조</span></div>
    </section>

    <section class="step">
      <div class="kicker">두 번째 컷</div>
      <h1>슬라이드는 뼈대만,<br>나머지는 <span class="hlr">판서로</span>.</h1>
    </section>

    <section class="step">
      <div class="kicker">마지막 컷</div>
      <h1>초대 / 다음 편 떡밥</h1>
      <div class="sub"><span class="hlb">다음 편 — …</span></div>
    </section>

  <!-- ===================== STEPS END ===================== -->

  </div>

  <div id="board"></div>
  <canvas id="pad"></canvas>

  <!-- UI -->
  <button id="fsBtn" title="전체화면">⛶</button>
  <div id="dots"></div>
  <div id="idx">1 / 1</div>
  <button class="nav" id="prev">‹</button>
  <button class="nav" id="next">›</button>
  <div class="hint">펜=판서 · w 배경 · b 판서모드 · g 모눈 · ✂선택 · ✋이동</div>

  <div id="tools">
    <button class="btn" id="boardBtn">🪧 판서모드</button>
    <button class="btn" id="gridBtn" title="모눈종이 격자 (g)">▦ 모눈</button>
    <div class="sep"></div>
    <div class="bgc sel" data-bg="navy" title="남색 (w로 순환)" style="background:#101722"></div>
    <div class="bgc" data-bg="chalk" title="칠판" style="background:#14382f"></div>
    <div class="bgc" data-bg="white" title="화이트보드" style="background:#fbfbf8"></div>
    <div class="bgc" data-bg="black" title="검정" style="background:#000"></div>
    <div class="sep"></div>
    <div class="swatch sel" style="background:#ffffff" data-c="#ffffff"></div>
    <div class="swatch" style="background:#ffd25c" data-c="#ffd25c"></div>
    <div class="swatch" style="background:#5cc8ff" data-c="#5cc8ff"></div>
    <div class="swatch" style="background:#ff5c6e" data-c="#ff5c6e"></div>
    <div class="swatch" style="background:#54e3a0" data-c="#54e3a0"></div>
    <div class="sep"></div>
    <div class="sizes">
      <div class="sz" data-s="2"><i style="width:5px;height:5px"></i></div>
      <div class="sz sel" data-s="4"><i style="width:9px;height:9px"></i></div>
      <div class="sz" data-s="8"><i style="width:15px;height:15px"></i></div>
    </div>
    <div class="sep"></div>
    <button class="btn" id="selBtn" title="선택 — 사각형으로 묶어 끌기">✂ 선택</button>
    <button class="btn" id="moveBtn" title="이동 — 그림을 눌러 이어진 부분을 끌어 옮기기">✋ 이동</button>
    <button class="btn" id="eraser">지우개</button>
    <button class="btn" id="undo">되돌리기</button>
    <button class="btn" id="clear">전체지움</button>
  </div>
</div>

<script>
/* ── 판서슬라이드 엔진 (고정) — 수정 금지 ── */
(function(){
  const steps = Array.from(document.querySelectorAll('.step'));
  const total = steps.length;
  let cur = 0;
  const dots = document.getElementById('dots');
  steps.forEach((_,i)=>{const d=document.createElement('div');d.className='dot'+(i===0?' on':'');dots.appendChild(d);});
  const dotEls = Array.from(dots.children);
  const idxEl = document.getElementById('idx');
  idxEl.textContent = '1 / '+total;

  const pad = document.getElementById('pad');
  const ctx = pad.getContext('2d');
  let dpr = Math.max(1, window.devicePixelRatio||1);
  // 슬라이드/판서모드별 '획(stroke) 객체' 목록 — 손 안 떼고 그린 한 획 = 객체 하나
  const slideStrokes = Array.from({length: total}, ()=>[]);
  let boardStrokes = [];
  let strokes = slideStrokes[0];     // 현재 활성 레이어(배열 참조)
  const undoStack = [];               // 각 항목 = strokes 배열의 스냅샷(shallow copy)
  function setLayer(arr){ strokes = arr; if(boardMode) boardStrokes = arr; else slideStrokes[cur] = arr; }
  function snapshot(){ undoStack.push(strokes.slice()); if(undoStack.length>60) undoStack.shift(); }

  function fit(restore){
    dpr = Math.max(1, window.devicePixelRatio||1);
    pad.width = Math.floor(innerWidth*dpr); pad.height = Math.floor(innerHeight*dpr);
    pad.style.width = innerWidth+'px'; pad.style.height = innerHeight+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.lineCap='round'; ctx.lineJoin='round';
    if(restore) render();
  }
  fit(false);
  addEventListener('resize',()=>fit(true));

  function clearCanvas(){ctx.clearRect(0,0,innerWidth,innerHeight);}
  function lineW2(s,pr){ return Math.max(1, s.size*(0.45 + pr*1.1)); }
  function drawStroke(s,ox,oy){ ox=ox||0; oy=oy||0; const pts=s.pts; if(!pts.length) return;
    ctx.globalCompositeOperation = s.erase?'destination-out':'source-over';
    ctx.strokeStyle=s.color; ctx.fillStyle=s.color;
    if(pts.length===1){ const w=lineW2(s,pts[0].p); ctx.beginPath(); ctx.arc(pts[0].x+ox,pts[0].y+oy,(s.erase?w*2.4:w)/2,0,Math.PI*2); ctx.fill(); }
    else { for(let i=1;i<pts.length;i++){ const w=s.erase?lineW2(s,pts[i].p)*2.6:lineW2(s,pts[i].p);
      ctx.lineWidth=w; ctx.beginPath(); ctx.moveTo(pts[i-1].x+ox,pts[i-1].y+oy); ctx.lineTo(pts[i].x+ox,pts[i].y+oy); ctx.stroke(); } }
    ctx.globalCompositeOperation='source-over';
  }
  function render(){ clearCanvas(); for(const s of strokes) drawStroke(s,0,0); }

  let drawing=false, color='#ffffff', size=4, erasing=false, last=null, curStroke=null;
  let eraseGesture=false, erasePath=null;
  function pos(e){return {x:e.clientX, y:e.clientY, p:(e.pressure&&e.pressure>0)?e.pressure:0.5};}
  function lineW(pressure){ return Math.max(1, size * (0.45 + pressure*1.1)); }

  /* ── 선택·이동: '획(stroke) 객체' 단위 (겹쳐도 따로 잡힘) ── */
  let selMode=false, moveMode=false, selecting=false, selStart=null, selBase=null;
  let floatStrokes=null, floatBB=null, floatDX=0, floatDY=0, floatBase=null, movingFloat=false, grab=null;
  const DASH='#5cc8ff';
  function getFull(){ return ctx.getImageData(0,0,pad.width,pad.height); }
  function dashedRect(x,y,w,h){ ctx.save(); ctx.setLineDash([7,5]); ctx.lineWidth=1.5; ctx.strokeStyle=DASH; ctx.strokeRect(x,y,w,h); ctx.restore(); }
  function bboxOf(arr){ let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; for(const s of arr){ const m=s.size+4; for(const q of s.pts){ if(q.x-m<x0)x0=q.x-m; if(q.y-m<y0)y0=q.y-m; if(q.x+m>x1)x1=q.x+m; if(q.y+m>y1)y1=q.y+m; } } return {x:x0,y:y0,w:x1-x0,h:y1-y0}; }
  function distSeg(p,a,b){ const dx=b.x-a.x, dy=b.y-a.y, L=dx*dx+dy*dy; let t=L?((p.x-a.x)*dx+(p.y-a.y)*dy)/L:0; t=Math.max(0,Math.min(1,t)); return Math.hypot(p.x-(a.x+t*dx), p.y-(a.y+t*dy)); }
  function distStroke(p,s){ const pts=s.pts; if(pts.length===1) return Math.hypot(p.x-pts[0].x,p.y-pts[0].y); let m=1e9; for(let i=1;i<pts.length;i++) m=Math.min(m,distSeg(p,pts[i-1],pts[i])); return m; }
  function pickStroke(p){ for(let i=strokes.length-1;i>=0;i--){ const s=strokes[i]; if(s.erase) continue; if(distStroke(p,s)<=12+s.size) return i; } return -1; }
  function strokeInRect(s,x,y,w,h){ for(const q of s.pts){ if(q.x>=x&&q.x<=x+w&&q.y>=y&&q.y<=y+h) return true; } return false; }
  function insideFloat(p){ return floatStrokes && p.x>=floatBB.x+floatDX && p.x<=floatBB.x+floatDX+floatBB.w && p.y>=floatBB.y+floatDY && p.y<=floatBB.y+floatDY+floatBB.h; }
  function redrawFloat(){ if(!floatStrokes) return; ctx.putImageData(floatBase,0,0); for(const s of floatStrokes) drawStroke(s,floatDX,floatDY); dashedRect(floatBB.x+floatDX,floatBB.y+floatDY,floatBB.w,floatBB.h); }
  function liftStrokes(idxs){ idxs.sort((a,b)=>a-b); floatStrokes=idxs.map(i=>strokes[i]); for(let k=idxs.length-1;k>=0;k--) strokes.splice(idxs[k],1); render(); floatBase=getFull(); floatBB=bboxOf(floatStrokes); floatDX=0; floatDY=0; redrawFloat(); }
  function commitFloat(){ if(!floatStrokes) return; for(const s of floatStrokes){ strokes.push({color:s.color,size:s.size,erase:s.erase,pts:s.pts.map(q=>({x:q.x+floatDX,y:q.y+floatDY,p:q.p}))}); } floatStrokes=null; floatBB=null; floatBase=null; floatDX=0; floatDY=0; movingFloat=false; render(); }

  /* ── 지우개(파괴적): 경로 근처 점을 실제로 잘라내 획 분할 ── */
  function nearPath(q,path,r){ if(path.length===1) return Math.hypot(q.x-path[0].x,q.y-path[0].y)<=r;
    for(let i=1;i<path.length;i++){ if(distSeg(q,path[i-1],path[i])<=r) return true; } return false; }
  function applyErase(path){
    const r = Math.max(6, size*1.7*1.3);
    const before = strokes.slice(); const out=[]; let changed=false;
    for(const s of strokes){
      if(s.erase){ out.push(s); continue; }
      const rr = r + s.size*0.5; let piece=[], removed=false;
      for(const q of s.pts){
        if(nearPath(q,path,rr)){ removed=true; if(piece.length){ out.push({color:s.color,size:s.size,erase:false,pts:piece}); piece=[]; } }
        else piece.push(q);
      }
      if(!removed){ out.push(s); continue; }
      changed=true;
      if(piece.length) out.push({color:s.color,size:s.size,erase:false,pts:piece});
    }
    if(changed){ undoStack.push(before); if(undoStack.length>60) undoStack.shift(); setLayer(out); }
    render();
  }

  /* ── 모드 ── */
  let boardMode=false, gridOn=false;
  const boardEl=document.getElementById('board');
  const $=id=>document.getElementById(id);
  function setCursor(){ pad.style.cursor = moveMode?'grab':(erasing?'cell':'crosshair'); }
  function setSel(on){ if(!on) commitFloat(); selMode=on; if(on){ moveMode=false; erasing=false; } syncBtns(); }
  function setMove(on){ if(!on) commitFloat(); moveMode=on; if(on){ selMode=false; erasing=false; } syncBtns(); }
  function setEraser(on){ commitFloat(); erasing=on; if(on){ selMode=false; moveMode=false; } syncBtns(); }
  function syncBtns(){ $('selBtn').classList.toggle('on',selMode); $('moveBtn').classList.toggle('on',moveMode);
    $('eraser').classList.toggle('on',erasing); $('boardBtn').classList.toggle('on',boardMode); $('gridBtn').classList.toggle('on',gridOn); setCursor(); }
  function switchLayer(arr){ commitFloat(); strokes=arr; undoStack.length=0; render(); }
  function toggleBoard(){ commitFloat(); boardMode=!boardMode; boardEl.classList.toggle('show',boardMode);
    switchLayer(boardMode?boardStrokes:slideStrokes[cur]); syncBtns(); }
  function toggleGrid(){ gridOn=!gridOn; boardEl.classList.toggle('grid',gridOn); if(gridOn&&!boardMode) toggleBoard(); syncBtns(); }
  function doUndo(){ if(floatStrokes) commitFloat(); const prev=undoStack.pop(); if(!prev) return; setLayer(prev); render(); }
  function doClear(){ commitFloat(); if(!strokes.length) return; snapshot(); setLayer([]); render(); }

  /* ── 슬라이드 이동 ── */
  function go(n){ if(n<0||n>=total||n===cur) return; commitFloat();
    steps[cur].classList.remove('active'); dotEls[cur].classList.remove('on');
    cur=n; steps[cur].classList.add('active'); dotEls[cur].classList.add('on'); idxEl.textContent=(cur+1)+' / '+total;
    if(!boardMode) switchLayer(slideStrokes[cur]); }
  $('prev').onclick=()=>go(cur-1); $('next').onclick=()=>go(cur+1);
  if(total<=1){ ['prev','next','dots','idx'].forEach(id=>$(id).style.display='none'); }

  /* ── 포인터 ── */
  let lastP=null;
  function normRect(a,b){ return {x:Math.min(a.x,b.x), y:Math.min(a.y,b.y), w:Math.abs(b.x-a.x), h:Math.abs(b.y-a.y)}; }
  pad.addEventListener('contextmenu',e=>e.preventDefault());
  pad.addEventListener('pointerdown',e=>{
    if(e.button>0) return;
    try{ pad.setPointerCapture(e.pointerId); }catch(_){}
    const p=pos(e); lastP=p;
    if(selMode||moveMode){
      if(floatStrokes && insideFloat(p)){ movingFloat=true; grab={x:p.x-floatDX,y:p.y-floatDY}; if(moveMode) pad.style.cursor='grabbing'; return; }
      if(floatStrokes) commitFloat();
      if(moveMode){ const i=pickStroke(p); if(i<0) return; snapshot(); liftStrokes([i]); movingFloat=true; grab={x:p.x,y:p.y}; pad.style.cursor='grabbing'; return; }
      selecting=true; selStart=p; render(); selBase=getFull(); return;
    }
    if(erasing){ eraseGesture=true; erasePath=[p]; drawStroke({color:'#000',size,erase:true,pts:[p]}); return; }
    snapshot(); drawing=true; curStroke={color,size,erase:false,pts:[p]}; strokes.push(curStroke); drawStroke(curStroke); last=p;
  });
  pad.addEventListener('pointermove',e=>{
    const evs=(e.getCoalescedEvents&&e.getCoalescedEvents().length)?e.getCoalescedEvents():[e];
    const p=pos(e); lastP=p;
    if(movingFloat){ floatDX=p.x-grab.x; floatDY=p.y-grab.y; redrawFloat(); return; }
    if(selecting){ ctx.putImageData(selBase,0,0); const r=normRect(selStart,p); dashedRect(r.x,r.y,r.w,r.h); return; }
    if(eraseGesture){ for(const ev of evs){ const q=pos(ev), l=erasePath[erasePath.length-1]; erasePath.push(q); drawStroke({color:'#000',size,erase:true,pts:[l,q]}); } return; }
    if(drawing){ for(const ev of evs){ const q=pos(ev); curStroke.pts.push(q); drawStroke({color,size,erase:false,pts:[last,q]}); last=q; } }
  });
  function endPointer(){
    if(movingFloat){ movingFloat=false; if(moveMode){ commitFloat(); pad.style.cursor='grab'; } return; }
    if(selecting){ selecting=false; const r=normRect(selStart,lastP||selStart); const idxs=[];
      if(r.w>3&&r.h>3) strokes.forEach((s,i)=>{ if(!s.erase&&strokeInRect(s,r.x,r.y,r.w,r.h)) idxs.push(i); });
      if(idxs.length){ snapshot(); liftStrokes(idxs); } else render(); return; }
    if(eraseGesture){ eraseGesture=false; applyErase(erasePath); erasePath=null; return; }
    if(drawing){ drawing=false; curStroke=null; last=null; }
  }
  pad.addEventListener('pointerup',endPointer);
  pad.addEventListener('pointercancel',endPointer);

  /* ── 툴바 ── */
  document.querySelectorAll('.swatch').forEach(sw=>sw.addEventListener('click',()=>{
    document.querySelectorAll('.swatch').forEach(x=>x.classList.remove('sel')); sw.classList.add('sel');
    color=sw.dataset.c; if(erasing||selMode||moveMode){ setEraser(false); } }));
  document.querySelectorAll('.sz').forEach(b=>b.addEventListener('click',()=>{
    document.querySelectorAll('.sz').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); size=+b.dataset.s; }));
  $('boardBtn').onclick=toggleBoard; $('gridBtn').onclick=toggleGrid;
  $('selBtn').onclick=()=>setSel(!selMode); $('moveBtn').onclick=()=>setMove(!moveMode);
  $('eraser').onclick=()=>setEraser(!erasing); $('undo').onclick=doUndo; $('clear').onclick=doClear;

  /* ── 전체화면 토글(좌상단, 태블릿용) ── */
  const fsBtn=$('fsBtn');
  function isFs(){ return !!(document.fullscreenElement||document.webkitFullscreenElement); }
  fsBtn.addEventListener('click',()=>{ const el=document.documentElement;
    if(isFs()){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); }
    else { const rq=el.requestFullscreen||el.webkitRequestFullscreen; if(rq) rq.call(el); } });
  ['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{ fsBtn.classList.toggle('on',isFs()); setTimeout(()=>fit(true),60); }));

  /* ── 단축키 ── */
  addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey)&&(e.key==='z'||e.key==='Z')){ e.preventDefault(); doUndo(); return; }
    if(e.ctrlKey||e.metaKey||e.altKey) return;
    if(e.key==='ArrowRight'||e.key==='PageDown') go(cur+1);
    else if(e.key==='ArrowLeft'||e.key==='PageUp') go(cur-1);
    else if(e.key==='b') toggleBoard();
    else if(e.key==='g') toggleGrid();
    else if(e.key==='e') setEraser(!erasing);
    else if(e.key==='c') doClear();
    else if(e.key==='Escape') commitFloat();
  });

  /* ── 배경 테마 + 펜 팔레트 자동 전환 ── */
  const DARK=['#ffffff','#ffd25c','#5cc8ff','#ff5c6e','#54e3a0'];
  const LIGHT=['#1b1f24','#e07b00','#1f6fe0','#e0303e','#1f9d55'];
  const BGS=['navy','chalk','white','black'];
  let bg='navy';
  function remap(c,from,to){ const i=from.indexOf(c); return i<0?c:to[i]; }
  function setBg(name){
    commitFloat();
    const wasLight=(bg==='white'), isLight=(name==='white');
    bg=name; document.body.dataset.bg=name;
    document.querySelectorAll('.bgc').forEach(x=>x.classList.toggle('sel',x.dataset.bg===name));
    if(wasLight!==isLight){
      const from=isLight?DARK:LIGHT, to=isLight?LIGHT:DARK;
      document.querySelectorAll('.swatch').forEach((sw,i)=>{ sw.dataset.c=to[i]; sw.style.background=to[i]; });
      color=remap(color,from,to);
      const layers=slideStrokes.concat([boardStrokes]);
      for(const L of layers) for(const st of L) if(!st.erase) st.color=remap(st.color,from,to);
      for(const U of undoStack) for(const st of U) if(!st.erase) st.color=remap(st.color,from,to);
      render();
    }
    try{ localStorage.setItem('panseo-bg',name); }catch(_){}
  }
  document.querySelectorAll('.bgc').forEach(c=>c.addEventListener('click',()=>setBg(c.dataset.bg)));
  addEventListener('keydown',e=>{ if(e.key==='w'&&!e.ctrlKey&&!e.metaKey&&!e.altKey) setBg(BGS[(BGS.indexOf(bg)+1)%BGS.length]); });
  try{ const saved=localStorage.getItem('panseo-bg'); if(saved&&BGS.includes(saved)) setBg(saved); }catch(_){}
  syncBtns();
})();
</script>
</body>
</html>
